<section id="projects" class="mb-18">
  <app-section-heading [intro]="intro" />

  <div class="grid gap-5 sm:grid-cols-2 mid:grid-cols-3">
    @for (project of projects; track project.title) {
      <!-- h-full + mt-auto：讓有連結的卡片把連結壓在底部，
           與同列沒有連結的卡片仍維持等高 -->
      <article
        class="flex h-full flex-col rounded-card border border-line bg-surface p-[26px] shadow-card transition-[transform,box-shadow] duration-200 hover:-translate-y-[3px] hover:shadow-card-hover"
      >
        <span class="mb-3 block text-[1.8rem]">{{ project.icon }}</span>
        <h3 class="mb-2 text-[1rem] font-bold text-ink">{{ project.title }}</h3>
        <p class="text-[0.88rem] leading-[1.65] text-ink-soft">
          {{ project.desc }}
        </p>
        <div class="mt-3 text-[0.78rem] leading-[1.6] text-muted">
          {{ project.stack.join(' · ') }}
        </div>
        @if (project.link) {
          <a
            class="mt-auto inline-flex items-center gap-1 self-start pt-4 text-[0.82rem] font-semibold text-primary transition-colors duration-200 hover:text-primary-hover"
            [href]="project.link.href"
            target="_blank"
            rel="noopener"
          >
            {{ project.link.label }}
            <span aria-hidden="true">↗</span>
          </a>
        } @else {
          <!-- 未公開的專案沒有連結，保留同高的隱形佔位，
               否則同一列會比有連結的那列矮 39px -->
          <span class="invisible mt-auto self-start pt-4 text-[0.82rem]" aria-hidden="true">—</span>
        }
      </article>
    }
  </div>
</section>
